><img src=\"MEDIA/834025386257137664_0.jpg\"/><\/p><p>What are you on about?<\/p><p>No, that's not what a moral wrongdoing is. Something isn't morally wrong because it's a perversion or icky; it's morally wrong because it causes harm. Victims can be dirty, victims aren't pristine, victims can be rough around the edges. Making morality about cleanness is about purity, and it evangelizes it; something morally repulsive is morally repulsive because it produces an ethical revulsion rooted in core values.<\/p><p>Yes, I know it's deplorable to rape a baby. I WAS raped as a baby, thank you very much.<\/p><p>Fics are fiction. I'm more concerned about the systematic romanticizing of rape in society, a lot of it promoted by Christianity and rape culture, as well as by misogynistic societal structures.<\/p><p>\"The masses\" are known for blindly believing anything you people have to say for yourselves until they dig for evidence. Your true feelings were known the moment you thought it appropriate to force religious conversion onto victims of infant sexual abuse by the Church. The fact that you think AO3 fics are the issue is a very sheltered and privileged position to have.<\/p><p><img src=\"MEDIA/834025386257137664_1.jpg\"/><\/p><p>Because you're arrogant.<\/p><p>I don't mind people who only speak one language but try to better themselves, but if you're an American stereotype and criticize other people's writing when yours is what it is, people are going to talk about it.<\/p><p>No, what's coming from a place of privilege is making your literacy issues about countries when you're in America. You're talking to someone who physically can't, or can barely, leave their house, so that \"physically learn a new language\" argument is 100% moot. As far as I know, you have full eyesight and a pair of working eyes and legs; you are very much privileged for having access to places and resources I'll never have. The internet exists: I never mastered English through some bookstore or by buying expensive school material. I am self-taught and have grown up on the internet.<\/p><p>This one has been your weakest defense yet.<\/p>"];
