>https://www.tumblr.com/clown-named-choco/834071909931057152/i-dont-need-to-have-any-word-if-you-expect-to?source=share<\/p><p>Coming from the person with a God Complex who genuinely thought they'd get a debate with Choco about their own experiences and documented evidence, LMFAO!<\/p><\/blockquote><p>I beg your finest pardon? Sanctuarium, I did not give you the floor. This isn't a debate; your words are why I'm calling you out. You don't feature in this discussion. The only one who's sorely mistaken is you, if you ever thought you had a say on the matter. I'm not asking whether you want to be called pro-life: I underlined your lies and contradictions, and you are pro-life. Your interpersonal processing of that fact is irrelevant; keep it to yourself.<\/p><p>You are only right about one thing: you don't need to have any words. Your actions have done all the talking against you:<\/p><p><img src=\"MEDIA/834074817494941696_0.png\"/><\/p><p>You are in no position to deflect. Posting my evidence against you doesn't matter; I will continue posting it, and I will keep winning the back-and-forth like I have before. I am calling you out for your actions; you can continue to argue in circles with yourself. I'm not asking whether you want to be called out: I have been calling you out and will continue to do so at my leisure, and the objective facts of your words and actions will continue not to take your protests or attention-seeking behaviors into account as a defense. The proof against you exists for everyone else to see what kind of person you are, the same way a judge doesn't let the offender give their opinion on whether they're guilty or not. What you say doesn't matter; we are talking about your actions. Stick to the topic or be quiet.<\/p><p>If you lie, people are going to talk about it. If you sexually harass people and stalk minors, people are going to talk about it. If you say something, then try to reframe it, and people point out your original words, people are going to call you out on it. There is nothing you can do about it, and whether you keep asking for attention or not doesn't influence the process.<\/p><p>Let me make something else clear: you are pro-life by the very definition of the term. I don't care whether you think you need to have words or not; you are not part of this. You only feature here being called out for your words and actions. You could have every word in your mind, and I could dismiss them entirely; it's up to me whether you are listened to or not. Consent isn't something you can make exceptions for, you don't get to call abortion murder, a fetus is not a person, and your sanewashing and pro-Trump discourse get labeled by the objective meaning of what you said, not by what you'd like it to be or reframe it as. You have regressive Christian values I repudiate as a person, you don't deserve any respect, and you are a hypocrite who does everything they don't want others to do. You can address the minors and your religious sexual harassment or not; you're guilty of both regardless. None of this is a debate in 2026. Go somewhere else to indoctrinate gullible people; your nonsense has no place in my periphery.<\/p><p><img src=\"MEDIA/834074817494941696_1.png\"/><\/p><p>The lesson continues.<\/p><p><img src=\"MEDIA/834074817494941696_2.png\"/><\/p><p><img src=\"MEDIA/834074817494941696_3.png\"/><\/p><p>Lesson time is lesson time after all.<\/p><p><img src=\"MEDIA/834074817494941696_4.png\"/><\/p><p>When your newest and biggest fans keep following your blog, but you're in the middle of lesson time and can't give them attention, next lesson on the list.<\/p><p><img src=\"MEDIA/834074817494941696_5.png\"/><\/p><p><img src=\"MEDIA/834074817494941696_6.png\"/><\/p><p><img src=\"MEDIA/834074817494941696_7.png\"/><\/p><p>The daily lessons against the Christian bigot and sexually harassing fan continue, as does the judgement, exactly like I said it would.<\/p>"];
