 genuinely thought reinterpreting and reframing is addressing, or that addressing your bigotry was in any way relates to your sexual harassment and stalking that you mislabel as \"false accusations\" which is funny af btw, because something that's true by definition can't be false, you also say you hate hypocrites but you're the biggest hypocrite ever, which I've proved thousands of times, an example when you sent your ask from your nsfw account which you, as always, had zero argument for, alas, you also made a mistake thinking it's either call out your grammar and fallacies or call our your lying, this is incorrect, I can do all of them at once<\/h1><p><img src=\"MEDIA/834049037388873728_0.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_1.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_2.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_3.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_4.png\"/><\/p><p>Let's break this down. I don't want more minors being influenced by your cultish indoctrination.<\/p><p>1<\/p><p>You didn't address anything, and what little you picked, you gave a different context.<\/p><p>2<\/p><p>You take your own post out of context, cherry-pick it and puzzle it together differently.<\/p><p>3<\/p><p>\"One of the things I hate most about Christian based social media accounts is that they are very loud about being anti death penalties. It's often not bad in itself, even I can sway towards that myself. <b>The problem is when they're also staunchly pro choice (<\/b>to very baffling extremes that have nothing to do with the safety of the mother) and make jokes about Charlie Kirk's death.\"<\/p><p>Being pro-choice isn't like being a centrist or a flavor of right or left. Using pro-life dog whistles makes you pro-life; that's not extremist thinking, it's calling a spade a spade. I know a lot about Pavlov's dogs, but we're not going to go there, because you're not educated enough for that. Remember, you used the word \"baffling\" about the fact ill for political disagreements and because it's \"a clump of cells.\"\"<\/p><p>Evangelizing a fetus and playing the victim card again, also making a strawman, without a source, about what these alleged same people will say. I can also say pro-lifers will say it's okay to murder babies if they're autistic because they are demonic. Oh wait, there are actually sources for this! You sound like people who debate the Holocaust under the guise of opinions. There's a difference between nuance and sanewashing; everything you say is sanewashing.<\/p><p>7<\/p><p>\"You're just as against hypocrites\"<\/p><p>We are not the same; do not compare me to you ever again. Yes, I am against hypocrites like yourself. Repeat yourself as many times as you like; being guilty twice makes you twice as guilty. And before you act like a clown, which is ironic given your username, and claim the guilty verdicts are xyz: screenshotting the evidence against you as \"Choco evidence\" is so much more pitiable. What a nothingburger.<\/p><p>8<\/p><p>\"I am pro choice\": you're not. As proven, you are pro-life. \"AFAB people have the right to decide what to do, but the decision is about a human being\": wrong. That human being is themselves. A fetus is not a human being, period. Having a fetus inside you does not mean having a person; the person is the mother. AFAB people have the right to decide what to do, full stop. That's where the sentence ends; it's not debatable.<\/p><p>\"Fetus: a human being or animal in the later stages of development before it is born\"<\/p><p>9<\/p><p>Your own definition being: \"later stages of development\". The fetal stage starts at the end of the tenth week of pregnancy. Before that it's an embryo. Per the CDC, 78.6% of US abortions in 2022 happened at or before 9 weeks: before there was a fetus at all. The \"clump of cells\" you object to is the stage your own definition leaves out. Biology doesn't tell you when a person begins; that's the question you answered with your premise, ergo, the pro-life one.<\/p><p>Under US federal law (1 U.S.C. § 8), \"person\" and \"human being\" are defined by being born alive, and the law explicitly takes no position before birth. Calling the fetus \"a human being\" in the legal sense is the pro-life premise. You brought it in yourself, then called it pro-choice.<\/p><p>For the record:<\/p><p>Dobbs v. Jackson (2022) overturned Roe v. Wade 5–4. Three of the five votes came from Trump's appointees: Neil Gorsuch, Brett Kavanaugh and Amy Coney Barrett. Trump called it \"the biggest WIN for LIFE in a generation\", said it was \"only made possible\" by his three justices, and later boasted: \"I was able to kill Roe v. Wade.\"<\/p><p>Exhibit B, in your own words: choice only for \"the safety of the mother\", the fetus as \"a miracle\", not \"a clump of cells\".<\/p><p>10<\/p><p>\"I didn't vote for Trump nor do I support him. I didn't agree with or like Kirk, but I don't think that it's fair to murder everyone because they have different opinions\"<\/p><p>Sanewashing again: painting a rapist and pedophile (Trump) as merely someone with different opinions, and putting these together. Ironically enough, it parallels you calling what every predator in the grooming ring did \"disagreements\", so it comes full circle. Your support for Trump was already implicit and reinforced, and your support for Kirk was right in our faces when you policed what people joked about regarding him. That's neither depth nor nuance; that's dogma.<\/p><p>There goes your complete mess of a post, without any of the uber nonsense you dressed it up as.<\/p><p><img src=\"MEDIA/834049037388873728_5.jpg\"/><\/p><p>That's right, keep proving my point. Your words are not a factor; this isn't a debate. This is about your actions and my situation, and you don't have the floor on either one. You being a pro-Trump pro-lifer isn't something you can reframe for your convenience: a spade is a spade, a fetus isn't a miracle, abortion isn't murder, and every single person I called out in my situation is guilty. The false accusations are your cult's documented track record, and you've lied so repeatedly that nothing you say has any meaning, and it can immediately be thrown out the window. Actions are louder than words, and your actions confirm you're a liar, a sexual harasser, a hypocrite, a Christian bigot and a shit person:<\/p><p><a href=\"https://www.tumblr.com/thischocosfinity/834074817494941696/httpswwwtumblrcomclown-named-choco8340719099?source=share\">Post by @thischocosfinity · 1 image<\/a><\/p><p><img src=\"MEDIA/834049037388873728_6.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_7.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_8.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_9.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_10.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_11.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_12.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_13.png\"/><\/p><p><img src=\"MEDIA/834049037388873728_14.png\"/><\/p><p>End of the story.<\/p>"];
