async function put(t){try{await navigator.clipboard.writeText(t);return true;}catch(_){try{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.position='fixed';a.style.left='-9999px';document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();return ok;}catch(__){return false;}}}
