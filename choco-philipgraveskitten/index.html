d<\/a><\/p><p>Block, Report, the usual, if you're comfortable enough victim blaming just to hear yourself bitching on someone else's work you're comfortable enough losing your blog, trolls like you have zero place on Tumblr.<\/p><p>Never let this weirdo near victims.<\/p>"];
