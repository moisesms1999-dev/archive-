="st" id="s0"></p><script>const P=["<!--reblog thischocosfinity 834019664862576640--><p><a href=\"https://www.tumblr.com/thischocosfinity/834019664862576640\">thischocosfinity<\/a>:<\/p><blockquote><p>Okay, wait for it, everybody: the Christian wallflower who deletes their blog over someone saying Christianity bad is going to teach us all about human indignity 😂<\/p><p><img src=\"MEDIA/834019664862576640_0.jpg\"/><\/p><p>No, the laughable joke is that a church-loving, monolingual ignoramus who believes a fetus is a miracle and had to ask a 14-year-old for writing advice acts like they are anything but a pathetic person. And the punchline is that over a thousand predators in a grooming ring have lost to a syskid, some threatened to commit online because of someone being mean back to them on the internet, and the whole deflection parades always come from either pedophiles or people who sent porn to minors, from burners. You've all done everything in your power while having such a numerical advantage, and most of you got dropped like naples, got your smears destroyed and got your actions exposed. That's the laughable joke.<\/p><p>You are illiterate and act with such misplaced confidence while failing to understand basic concepts most people over the age of 16 are capable of understanding. You litter the tag with irrelevant information and take the call-outs against you out of context to argue the made-up arguments in your head, then act surprised when it doesn't work and you get corrected in the same breath.<\/p><p>Thanks for admitting the burden is on you to defend yourself when the proof was already provided; everything else is context, important to point out how disgusting your actions are. Evidence isn't something abstract you can<\/p><p>Your reading comprehension is so garbage, your nonsensical babble is all there is. \"Erm, I can't read!!\" If you have to appeal to your own incompetence in order to shirk responsibility, that's the online equivalent of an insanity plea. \"It's proof enough!\" Nobody said this. It's not just enough, it's mountains of overwhelming amounts of proof that, contrary to your text fodder, can actually be split into comprehensible segments. My document has alt text, which nobody else bothered with for their prior slopfests made of word salad and extremely out-of-context excerpts meant to leave out their every action.<\/p><p>You being a native speaker is not a medal; it's a travesty and a clear stereotype of the American education system. As someone who has been accredited with the C2 certificate, which is given to people who can write and speak at a highly educated native-speaker level: learn how to write and understand what's being said, rather than relying on piss-poor pattern recognition and excuse-making. Your literacy is not my problem, and my evidence, unlike everyone else's deflections, is actually legible and fully sourced. Cope about it.<\/p><\/blockquote><p>Btw, run-on sentences are a stylistic preference, one I have for informal or semi-formal writing. I don't care what a 26-year-old zealot who sexually harasses minors, asks 14-year-olds for writing tips and doesn't know the word premise thinks on the matter; I can write a lot better than you. You know what I did when I had to address bullshit from anyone in the cult? I found a way to read it, regardless of how sloppy or convoluted it was, because I like to keep a record of everything. I never said the ruling was scary; if you're scared of words on a screen and an evidence grid of your public actions, you have problems to take to therapy.<\/p><p>If you want to buzz around and complain that it's hard to read so much evidence, you should've done some reading or, better yet, learned some life skills. No, the Bible isn't a valid literacy test; this isn't the Odyssey. Anyone can say they don't understand evidence to get out of addressing it. Newsflash, none of that matters: address the evidence, or you lose any right to argue, because you can't
