log preaches psychology and linguistics, you don't know anything about the world.<\/p><p>You also tried to block me after talking shit on my own blog, which is lousy levels of cowardice, and you've lost reblog privileges because of it.<\/p><p><img src=\"MEDIA/834388621872218112_0.webp\"/><\/p><p>Out of my sight you go.<\/p>"];
